<script>
  // Names the two shinylive iframes. They are generated by shinylive's own
  // runtime, so there is nowhere in `index.qmd` to write a `title=` on them,
  // and an untitled iframe has no accessible name (WCAG 4.1.2). The React-only
  // demo is hand-written and already carries one, hence `:not([title])`.
  //
  // The name is taken from the slide's own `h2`, so a renamed demo slide
  // renames its frame for free. Run on load *and* on every slide change:
  // shinylive builds its viewer while the block's script runs, which is not
  // ordered against this file.
  window.addEventListener("load", function () {
    var name = function () {
      document.querySelectorAll("iframe:not([title])").forEach(function (frame) {
        var slide = frame.closest("section");
        var heading = slide && slide.querySelector("h2");
        frame.title = (heading ? heading.textContent.trim() : "Demo") + " (interactive demo)";
      });
    };
    name();
    if (window.Reveal) Reveal.on("slidechanged", name);
  });
</script>
