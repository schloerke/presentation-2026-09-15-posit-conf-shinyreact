<script>
  // Restart the recording on a slide every time that slide becomes the current
  // one, so its beats always play in the order the talk needs.
  //
  // Two cases, because the deck has used both containers:
  //
  // - `<video>` (Plotomics Live). It autoplays and loops, so by the time you
  //   walk to the slide you are dropped into the middle of the loop. Unlike a
  //   GIF a video *can* be seeked, so this is just `currentTime = 0`. `play()`
  //   is called too: a browser that blocked autoplay leaves it paused, and a
  //   paused first frame reads as a screenshot rather than a recording.
  // - `<img src="*.gif">`. An animated GIF starts when the browser decodes it,
  //   i.e. at page load, and there is no DOM API to seek or replay one, so the
  //   restart has to force a fresh decode by re-assigning `src`. The blank in
  //   between matters: assigning the same URL back is a no-op, and the cached
  //   -image path can also skip the restart, so drop the src for a tick first.
  //   Cheap - the file is already in cache, so nothing goes over the wire.
  window.addEventListener("load", function () {
    if (!window.Reveal) return;
    var replay = function () {
      var slide = Reveal.getCurrentSlide();
      if (!slide) return;
      slide.querySelectorAll("video").forEach(function (v) {
        v.currentTime = 0;
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      });
      slide.querySelectorAll('img[src$=".gif"]').forEach(function (img) {
        var src = img.src;
        img.src = "";
        setTimeout(function () { img.src = src; }, 0);
      });
    };
    Reveal.on("slidechanged", replay);
    replay();
  });
</script>
