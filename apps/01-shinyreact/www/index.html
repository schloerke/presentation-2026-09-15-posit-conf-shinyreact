<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Old Faithful — shinyreact</title>
    <!-- Shiny's and shinyreact's script/link tags are inserted here. It is a
         plain <meta> tag, so this file stays valid HTML. -->
    <meta name="shiny-dependency-placeholder" content="">
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- The mount point. Visible until React takes over, so a slow bundle
         shows something other than a blank page. The styling goes on an inner
         div that React replaces - a class on #root itself would survive the
         mount, and `.placeholder`'s fixed height would then crop the app. -->
    <div id="root"><div class="placeholder">Loading…</div></div>
    <!-- `defer`, not a bare script: the shinyreact bundle in <head> is
         deferred, and deferred scripts run in document order. A non-deferred
         script here would run first and find no `window.shinyreact`. -->
    <script src="app.js" defer></script>
    <!-- shinylive runs this page in an iframe, so reveal never sees these keys.
         Hand them back via reveal's postMessage API. Identical in all three
         demos (apps/02-react-only/www/index.html, apps/00-old-faithful-trim/
         app.R) - change one, change all three. -->
    <script>
      // PageUp/PageDown is what most presenter remotes send and no widget wants
      // them, so they always go to the deck. A focused slider owns the arrows
      // and space, or advancing the deck would also drag the control.
      const deckKeys = { PageUp: 33, PageDown: 34 };
      const sharedKeys = { ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, " ": 32, Escape: 27 };
      addEventListener("keydown", (e) => {
        const widget = e.target instanceof Element &&
          e.target.closest("input, select, textarea, button, [contenteditable]");
        const keyCode = deckKeys[e.key] || (widget ? 0 : sharedKeys[e.key]);
        if (keyCode && parent !== window) {
          parent.postMessage(JSON.stringify({ method: "triggerKey", args: [keyCode] }), "*");
        }
      });
    </script>
  </body>
</html>
