<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Old Faithful — React only</title>
    <link rel="stylesheet" href="app.css" />
    <!-- Vendored React 18 UMD (the last release that ships one), so this page
         runs from a plain file server with no build step and no network. -->
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script src="data.js"></script>
    <script src="app.js"></script>
    <!-- The deck loads this page in an iframe, so reveal never sees these keys.
         Hand them back via reveal's postMessage API: triggerKey runs whatever
         reveal itself has bound to the code, so no keymap is duplicated here. -->
    <script>
      const deckKeys = { ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, " ": 32, Escape: 27 };
      addEventListener("keydown", (e) => {
        const keyCode = deckKeys[e.key];
        if (keyCode && parent !== window) {
          parent.postMessage(JSON.stringify({ method: "triggerKey", args: [keyCode] }), "*");
        }
      });
    </script>
  </body>
</html>
