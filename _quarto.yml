# Only here so quarto reads `_environment` (it does that for projects, not for
# single-file renders) - that file carries SHINYLIVE_WASM_PACKAGES=0, which the
# shinyreact shinylive app needs. See CLAUDE.md.
project:
  type: default
  render:
    - index.qmd
  # Everything the render needs lands in _site/, so publishing is "upload
  # _site/". `apps/` is a resource because slide 02 loads it in an iframe by
  # relative path.
  output-dir: _site
  resources:
    - apps/**
    # The compiled theme's url()s (title logo, conf logo) walk out of
    # index_files/libs/revealjs/dist/theme/ to _site/theme/. Without this they
    # only resolve under `quarto preview`, which serves the project root.
    - theme/*.png
    - theme/*.svg
    # Quarto traces an `![](…)` but not a `src=` inside a raw-html block, and
    # the Plotomics Live recording is a `<video>`. Without this the slide is a
    # black box in a served render.
    - images/*.mp4
  # Bundles wasm-repo/ into the render so the deck runs with no network.
  post-render:
    - bundle-wasm.R
