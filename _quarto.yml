# Only here so quarto reads `_environment` (it does that for projects, not for
# single-file renders) - that file carries SHINYLIVE_WASM_PACKAGES=0, which the
# shinyreact shinylive app needs. See CLAUDE.md.
project:
  type: default
  render:
    - index.qmd
  # Everything the render needs lands in _site/, so publishing is "upload
  # _site/". `apps/` is a resource because slide 02 loads it in an iframe by
  # relative path.
  output-dir: _site
  resources:
    - apps/**
  # Bundles wasm-repo/ into the render so the deck runs with no network.
  post-render:
    - bundle-wasm.R
