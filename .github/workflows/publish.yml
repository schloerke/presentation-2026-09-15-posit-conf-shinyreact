name: Publish slides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a PR this is the whole workflow: render it, prove it still builds, stop
  # short of uploading anything.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false
      # `mermaid-format: svg` pre-renders the diagram with headless Chrome.
      - run: quarto install chromium --no-prompt

      # `cache: always` keeps the package cache even when the render fails,
      # which is the whole reason for using this over setup-r-dependencies.
      # There is no package here, so `packages` replaces the `local::.` default.
      - uses: rstudio/shiny-workflows/setup-r-package@v1
        with:
          # Must match webR's R series - see the wasm-repo/ notes in CLAUDE.md.
          r-version: "4.5"
          cache: always
          packages: |
            any::shinylive
            posit-dev/shinyreact/pkg-r

      # The shinylive R package unpacks ~700 MB of web assets outside the R
      # library, on first use rather than at install time - so the package
      # cache above does not cover it.
      - name: Locate the shinylive assets
        id: shinylive
        shell: Rscript {0}
        run: |
          cat(
            "dir=", tools::R_user_dir("shinylive", "cache"), "\n",
            "version=", as.character(shinylive::assets_version()), "\n",
            sep = "", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE
          )
      - uses: actions/cache/restore@v4
        id: shinylive-cache
        with:
          path: ${{ steps.shinylive.outputs.dir }}
          key: shinylive-${{ runner.os }}-${{ steps.shinylive.outputs.version }}

      - run: quarto render

      # Saved even if the render failed, and skipped on a hit: restore/save
      # rather than `actions/cache` so a red PR still leaves the assets behind.
      - uses: actions/cache/save@v4
        if: always() && steps.shinylive-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.shinylive.outputs.dir }}
          key: shinylive-${{ runner.os }}-${{ steps.shinylive.outputs.version }}

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: render
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
