name: Publish slides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a PR this is the whole workflow: render it, prove it still builds, stop
  # short of uploading anything.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false
      # `mermaid-format: svg` pre-renders the diagram with headless Chrome.
      - run: quarto install chromium --no-prompt

      # `cache: always` keeps the package cache even when the render fails,
      # which is the whole reason for using this over setup-r-dependencies.
      # There is no package here, so `packages` replaces the `local::.` default.
      - uses: rstudio/shiny-workflows/setup-r-package@v1
        with:
          # The host R, which only renders. It does *not* have to match webR's
          # own R (4.6.0 at the pinned shinylive below). See CLAUDE.md.
          r-version: "4.5"
          cache: always
          # Both refs are pinned, for the same reason: this is what the deck
          # actually runs on, and it should not change under you on a push.
          # - `shinylive` decides which web assets ship, and those decide webR's
          #   own R version. 0.5.0 -> assets 0.10.12 -> webR R 4.6.0.
          # - the `shinyreact` tag is load-bearing besides: shinylive looks for
          #   the Wasm assets on the GitHub release named by the install's
          #   RemoteRef, and plain `HEAD` has no release.
          packages: |
            cran::shinylive@0.5.0
            posit-dev/shinyreact/pkg-r@r/v0.1.0

      # shinylive's web assets are deliberately *not* cached. They live outside
      # the R library (`~/.cache/shinylive`), so the package cache above misses
      # them - but measured in this job the download is 2s and the unzip 2s,
      # against ~740 MB unpacked. Caching that is slower than fetching it, and
      # it would crowd the R package cache out of the repo's 10 GB.
      - run: quarto render

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: render
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
