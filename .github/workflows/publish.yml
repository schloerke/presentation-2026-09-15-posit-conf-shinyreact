name: Publish slides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a PR this is the whole workflow: render it, prove it still builds, stop
  # short of uploading anything.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false
      # `mermaid-format: svg` pre-renders the diagram with headless Chrome.
      - run: quarto install chromium --no-prompt

      - uses: r-lib/actions/setup-r@v2
        with:
          # Must match webR's R series - see the wasm-repo/ notes in CLAUDE.md.
          r-version: "4.5"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            posit-dev/shinyreact/pkg-r

      - run: quarto render

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: render
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
